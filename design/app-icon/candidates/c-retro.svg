    <rect x="416" y="544" width="32" height="32" fill="#59bfa9"/>
    <rect x="448" y="544" width="32" height="32" fill="#ffca66"/>
    <rect x="480" y="544" width="64" height="32" fill="#fff3d2"/>
    <rect x="544" y="544" width="32" height="32" fill="#ffca66"/>
    <rect x="576" y="544" width="32" height="32" fill="#2f8471"/>
    <rect x="608" y="544" width="32" height="32" fill="#0e3d36"/>
    <!-- body r18, scroll -->
    <rect x="384" y="576" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="576" width="32" height="32" fill="#59bfa9"/>
    <rect x="448" y="576" width="32" height="32" fill="#ffca66"/>
    <rect x="480" y="576" width="64" height="32" fill="#f3e5c4"/>
    <rect x="544" y="576" width="32" height="32" fill="#ffca66"/>
    <rect x="576" y="576" width="32" height="32" fill="#2f8471"/>
    <rect x="608" y="576" width="32" height="32" fill="#0e3d36"/>
    <!-- body r19, glow fades -->
    <rect x="384" y="608" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="608" width="64" height="32" fill="#59bfa9"/>
    <rect x="480" y="608" width="64" height="32" fill="#ffca66"/>
    <rect x="544" y="608" width="64" height="32" fill="#2f8471"/>
    <rect x="608" y="608" width="32" height="32" fill="#0e3d36"/>
    <!-- body r20, waterline row -->
    <rect x="384" y="640" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="640" width="96" height="32" fill="#59bfa9"/>
    <rect x="512" y="640" width="96" height="32" fill="#2f8471"/>
    <rect x="608" y="640" width="32" height="32" fill="#0e3d36"/>
    <!-- body r21, submerged tint -->
    <rect x="384" y="672" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="672" width="128" height="32" fill="#41917f"/>
    <rect x="544" y="672" width="64" height="32" fill="#26695c"/>
    <rect x="608" y="672" width="32" height="32" fill="#0e3d36"/>
    <!-- body r22, submerged -->
    <rect x="384" y="704" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="704" width="96" height="32" fill="#41917f"/>
    <rect x="512" y="704" width="96" height="32" fill="#26695c"/>
    <rect x="608" y="704" width="32" height="32" fill="#0e3d36"/>
    <!-- bottom r23, rounded -->
    <rect x="416" y="736" width="192" height="32" fill="#0e3d36"/>

    <!-- waterline foam, in front of bottle -->
    <rect x="320" y="640" width="64" height="32" fill="#c9ece5"/>
    <rect x="640" y="640" width="64" height="32" fill="#c9ece5"/>
    <rect x="384" y="640" width="32" height="32" fill="#a5ded4"/>
    <rect x="608" y="640" width="32" height="32" fill="#a5ded4"/>
    <rect x="352" y="672" width="32" height="32" fill="#c9ece5"/>
    <rect x="640" y="672" width="32" height="32" fill="#c9ece5"/>

    <!-- warm glow reflected on the water -->
    <rect x="448" y="800" width="128" height="32" fill="#c79a4d"/>
    <rect x="416" y="832" width="96" height="32" fill="#a97f3c"/>
    <rect x="544" y="832" width="32" height="32" fill="#a97f3c"/>
    <rect x="480" y="864" width="64" height="32" fill="#8a6a33"/>

    <!-- ============ WIN-95 BEVEL FRAME ============ -->
    <rect x="0" y="0" width="1024" height="32" fill="#d9e2e0"/>
    <rect x="0" y="0" width="32" height="1024" fill="#d9e2e0"/>
    <rect x="0" y="992" width="1024" height="32" fill="#16332f"/>
    <rect x="992" y="0" width="32" height="1024" fill="#16332f"/>
