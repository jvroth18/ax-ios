<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 32x32 logical pixel grid, 1 px = 32 units -->
  <g shape-rendering="crispEdges">
    <!-- ============ SCENE ============ -->
    <!-- night-teal sky -->
    <rect x="0" y="0" width="1024" height="1024" fill="#0d6868"/>
    <!-- horizon glint -->
    <rect x="0" y="576" width="1024" height="32" fill="#2f9e9e"/>
    <!-- sea -->
    <rect x="0" y="608" width="1024" height="416" fill="#007272"/>

    <!-- stars -->
    <rect x="160" y="96" width="32" height="32" fill="#5fc0ba"/>
    <rect x="864" y="192" width="32" height="32" fill="#5fc0ba"/>
    <rect x="256" y="256" width="32" height="32" fill="#5fc0ba"/>
    <rect x="704" y="224" width="32" height="32" fill="#5fc0ba"/>
    <!-- pixel moon -->
    <rect x="736" y="96" width="64" height="64" fill="#e9f5ea"/>
    <rect x="736" y="96" width="32" height="32" fill="#c7ddd2"/>

    <!-- wave dither, behind bottle -->
    <rect x="64" y="640" width="128" height="32" fill="#39a6a0"/>
    <rect x="256" y="640" width="96" height="32" fill="#39a6a0"/>
    <rect x="672" y="640" width="128" height="32" fill="#39a6a0"/>
    <rect x="864" y="640" width="96" height="32" fill="#39a6a0"/>
    <rect x="128" y="704" width="96" height="32" fill="#056565"/>
    <rect x="800" y="704" width="96" height="32" fill="#056565"/>
    <rect x="192" y="768" width="128" height="32" fill="#2f9a95"/>
    <rect x="704" y="768" width="128" height="32" fill="#2f9a95"/>
    <rect x="64" y="832" width="96" height="32" fill="#056565"/>
    <rect x="256" y="832" width="96" height="32" fill="#056565"/>
    <rect x="832" y="832" width="96" height="32" fill="#056565"/>
    <rect x="128" y="896" width="128" height="32" fill="#2f9a95"/>
    <rect x="576" y="896" width="128" height="32" fill="#2f9a95"/>
    <rect x="800" y="896" width="96" height="32" fill="#2f9a95"/>

    <!-- ============ BOTTLE ============ -->
    <!-- cork -->
    <rect x="448" y="160" width="128" height="32" fill="#c98f5f"/>
    <rect x="448" y="192" width="128" height="32" fill="#a86a3d"/>
    <!-- neck r7-r9 -->
    <rect x="448" y="224" width="32" height="32" fill="#0e3d36"/>
    <rect x="480" y="224" width="32" height="32" fill="#59bfa9"/>
    <rect x="512" y="224" width="32" height="32" fill="#2f8471"/>
    <rect x="544" y="224" width="32" height="32" fill="#0e3d36"/>
    <rect x="448" y="256" width="32" height="32" fill="#0e3d36"/>
    <rect x="480" y="256" width="32" height="32" fill="#d9f5ec"/>
    <rect x="512" y="256" width="32" height="32" fill="#2f8471"/>
    <rect x="544" y="256" width="32" height="32" fill="#0e3d36"/>
    <rect x="448" y="288" width="32" height="32" fill="#0e3d36"/>
    <rect x="480" y="288" width="32" height="32" fill="#59bfa9"/>
    <rect x="512" y="288" width="32" height="32" fill="#2f8471"/>
    <rect x="544" y="288" width="32" height="32" fill="#0e3d36"/>
    <!-- shoulder r10 -->
    <rect x="416" y="320" width="32" height="32" fill="#0e3d36"/>
    <rect x="448" y="320" width="64" height="32" fill="#59bfa9"/>
    <rect x="512" y="320" width="64" height="32" fill="#2f8471"/>
    <rect x="576" y="320" width="32" height="32" fill="#0e3d36"/>
    <!-- body r11 -->
    <rect x="384" y="352" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="352" width="96" height="32" fill="#59bfa9"/>
    <rect x="512" y="352" width="96" height="32" fill="#2f8471"/>
    <rect x="608" y="352" width="32" height="32" fill="#0e3d36"/>
    <!-- body r12 -->
    <rect x="384" y="384" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="384" width="32" height="32" fill="#d9f5ec"/>
    <rect x="448" y="384" width="64" height="32" fill="#59bfa9"/>
    <rect x="512" y="384" width="96" height="32" fill="#2f8471"/>
    <rect x="608" y="384" width="32" height="32" fill="#0e3d36"/>
    <!-- body r13 -->
    <rect x="384" y="416" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="416" width="32" height="32" fill="#d9f5ec"/>
    <rect x="448" y="416" width="64" height="32" fill="#59bfa9"/>
    <rect x="512" y="416" width="96" height="32" fill="#2f8471"/>
    <rect x="608" y="416" width="32" height="32" fill="#0e3d36"/>
    <!-- body r14, glow begins -->
    <rect x="384" y="448" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="448" width="32" height="32" fill="#d9f5ec"/>
    <rect x="448" y="448" width="32" height="32" fill="#59bfa9"/>
    <rect x="480" y="448" width="64" height="32" fill="#ffca66"/>
    <rect x="544" y="448" width="64" height="32" fill="#2f8471"/>
    <rect x="608" y="448" width="32" height="32" fill="#0e3d36"/>
    <!-- body r15, scroll -->
    <rect x="384" y="480" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="480" width="32" height="32" fill="#d9f5ec"/>
    <rect x="448" y="480" width="32" height="32" fill="#ffca66"/>
    <rect x="480" y="480" width="64" height="32" fill="#f3e5c4"/>
    <rect x="544" y="480" width="32" height="32" fill="#ffca66"/>
    <rect x="576" y="480" width="32" height="32" fill="#2f8471"/>
    <rect x="608" y="480" width="32" height="32" fill="#0e3d36"/>
    <!-- body r16, glow core -->
    <rect x="384" y="512" width="32" height="32" fill="#0e3d36"/>
    <rect x="416" y="512" width="32" height="32" fill="#d9f5ec"/>
    <rect x="448" y="512" width="32" height="32" fill="#ffca66"/>
    <rect x="480" y="512" width="64" height="32" fill="#fff3d2"/>
    <rect x="544" y="512" width="32" height="32" fill="#ffca66"/>
    <rect x="576" y="512" width="32" height="32" fill="#2f8471"/>
    <rect x="608" y="512" width="32" height="32" fill="#0e3d36"/>
    <!-- body r17, glow core -->
