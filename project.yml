# XcodeGen spec — run `xcodegen generate` to produce ax-ios.xcodeproj (never commit the xcodeproj).
name: ax-ios
options:
  bundleIdPrefix: dev.ax
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    # Pin: mlx-swift-lm moves fast; bump deliberately and retest memory/tok-s.
    exactVersion: 3.31.3
  AXCore:
    path: Packages/AXCore

configs:
  Debug: debug
  Release: release

targets:
  AXAssistant:
    type: application
    platform: iOS
    sources:
      - AXAssistant
      # Sources are guarded by #if AX_DRIVER — inert unless the flag is set below.
      - AXDriver/DriverBridge
    dependencies:
      - package: AXCore
        product: AXCore
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      # MLXVLM is only used by the optional AXDriver module (AX_DRIVER flag);
      # SwiftPM links it lazily so including it here keeps one target simple.
      - package: MLXSwiftLM
        product: MLXVLM
    info:
      path: AXAssistant/Resources/Info.plist
      properties:
        CFBundleDisplayName: AX
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: AX records your voice request when you press the Action Button.
        NSSpeechRecognitionUsageDescription: AX transcribes your request on-device. Audio never leaves your iPhone.
        NSRemindersFullAccessUsageDescription: AX creates reminders you ask for by voice.
        NSCalendarsFullAccessUsageDescription: AX creates and reads calendar events you ask about.
        NSContactsUsageDescription: AX looks up contacts so it can call or message the right person.
        NSAppleMusicUsageDescription: AX plays music you ask for.
        LSApplicationQueriesSchemes: [shortcuts, tel, sms]
        CFBundleURLTypes:
          - CFBundleURLName: dev.ax.assistant
            CFBundleURLSchemes: [axassistant]
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ax.assistant
        # Swift 5 language mode for the app target: AVFoundation/UIKit plumbing predates
        # sending/Sendable annotations. AXCore builds in Swift 6 mode with tests.
        SWIFT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your Personal Team id here (Xcode > Settings > Accounts), or select it in the UI once.
        # DEVELOPMENT_TEAM: XXXXXXXXXX
      configs:
        Debug:
          # Append AX_DRIVER to build the experimental driver bridge (see AXDriver/README.md):
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
