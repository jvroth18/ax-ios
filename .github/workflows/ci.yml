name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  axcore-tests:
    name: AXCore unit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run swift test
        working-directory: Packages/AXCore
        run: swift test

  app-build-check:
    name: AXAssistant compile check (${{ matrix.flags || 'default' }})
    runs-on: macos-26
    # The AX_DRIVER leg is experimental and must not block merges.
    continue-on-error: ${{ matrix.flags != '' }}
    strategy:
      fail-fast: false
      matrix:
        flags: ["", "AX_DRIVER"]
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project ax-ios.xcodeproj \
            -scheme AXAssistant \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG ${{ matrix.flags }}" \
            CODE_SIGNING_ALLOWED=NO
